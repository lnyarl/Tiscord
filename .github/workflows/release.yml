name: Binary release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test and vet
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Vet failed' }
      - name: Build and package
        run: ./scripts/build-release.ps1 -Tag $env:GITHUB_REF_NAME
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem -LiteralPath "dist/release/$tag" -File |
            Where-Object { $_.Name -match '\.(zip|tar\.gz)$' -or $_.Name -eq 'SHA256SUMS.txt' } |
            ForEach-Object { $_.FullName }
          if ($assets.Count -ne 6) { throw 'Expected five archives and checksums' }
          $releaseArgs = @('release', 'create', $tag, '--verify-tag', '--draft', '--title', "Tiscord $tag")
          $notesPath = ".github/release-notes/$tag.md"
          if (Test-Path -LiteralPath $notesPath) { $releaseArgs += @('--notes-file', $notesPath) }
          else { $releaseArgs += '--generate-notes' }
          if ($tag.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
